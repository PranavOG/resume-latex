name: Compile and Deploy LaTeX Resume

on:
  push:
    branches: [ main ] # Change to master if that is your default branch

permissions:
  contents: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex # CHANGE THIS to your .tex filename
          
      - name: Prepare build directory
        run: |
          mkdir build
          cp main.pdf build/ # CHANGE THIS to your generated .pdf filename
          
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: gh-pages
          force_orphan: true
